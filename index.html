<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sleep IPTV</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
<style>
  *{box-sizing:border-box;margin:0}
  body{background:radial-gradient(circle at 80% 0,#2a0508,#0a0204 60%);color:#fff;
       font-family:system-ui,sans-serif;min-height:100vh;padding:20px}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
  .logo{font-size:28px;font-weight:700}.logo span{color:#e94545}
  .info{font-size:13px;opacity:.7}
  .grid{display:grid;gap:16px;grid-template-columns:1.1fr 1fr 1fr 1.3fr;
        grid-template-rows:260px 70px}
  .card{background:#161616;border:1px solid #2a2a2a;border-radius:28px;padding:22px;
        display:flex;flex-direction:column;justify-content:flex-end;cursor:pointer;
        transition:transform .15s}
  .card:hover{transform:scale(1.03)}
  .card .ico{font-size:40px;margin-bottom:auto}
  .card h2{font-size:26px}.card small{opacity:.6;font-size:15px}
  .vivo{background:linear-gradient(160deg,#ee4d4d,#d9302f);grid-row:span 2}
  .mini{background:#000;border:1px solid #2a2a2a;border-radius:35px;padding:0 22px;
        display:flex;align-items:center;gap:14px;cursor:pointer}
  .cont{grid-row:span 2;justify-content:flex-start;cursor:default}
  .cont h2{font-size:30px;margin:12px 0}
  .cont p{opacity:.6;font-size:14px}
  footer{margin-top:20px;display:flex;justify-content:space-between;font-size:14px}
  footer b{color:#e94545}
  #arquivo{display:none}
  #tela{display:none;position:fixed;inset:0;background:#0a0204;padding:20px;overflow:auto}
  #tela video{width:100%;max-height:45vh;background:#000;border-radius:16px;margin-top:12px}
  #tela input[type=text]{display:block;width:100%;padding:12px;margin:12px 0;border-radius:12px;border:1px solid #2a2a2a;background:#161616;color:#fff}
  .item{padding:12px;border-bottom:1px solid #222;cursor:pointer}
  .item:hover{background:#161616}
  @media(max-width:800px){.grid{grid-template-columns:1fr 1fr;grid-template-rows:auto}
    .vivo,.cont{grid-row:auto}}
</style>
</head>
<body>
<header>
  <div class="info">Lista M3U: <b id="nomeLista">nenhuma</b></div>
 <div class="logo"><span>🌙</span> Sleep IPTV</div>
  <label for="arquivo" style="cursor:pointer">📂 Abrir lista</label>
  <input type="file" id="arquivo" accept=".m3u,.m3u8">
</header>

<div class="grid">
  <div class="card vivo" id="bVivo"><div class="ico">📺</div>
    <h2>Canais ao Vivo</h2><small id="nVivo">0 Canais</small></div>
  <div class="card" id="bFilmes"><div class="ico">🎬</div>
    <h2>Filmes</h2><small id="nFilmes">0 Filmes</small></div>
  <div class="card" id="bSeries"><div class="ico">🎞️</div>
    <h2>Séries</h2><small id="nSeries">0 Séries</small></div>
  <div class="card cont"><div class="ico">▶️</div>
    <h2>Continuar Assistindo</h2>
    <p>Comece a assistir a qualquer filme ou série, e ele aparecerá aqui.</p></div>
  <div class="mini">❤️ <div><b>Favoritos</b><br><small>0 Itens</small></div></div>
  <div class="mini">🗂️ <div><b>Playlists</b><br><small id="nPl">0 Playlists</small></div></div>
</div>

<footer>
  <div>Playlist: <b id="rodape">-</b></div>
  <div id="hora"></div>
</footer>

<div id="tela">
  <button onclick="tela.style.display='none'">← Voltar</button>
  <video id="player" controls autoplay></video>
  <input type="text" id="busca" placeholder="Buscar...">
  <div id="canais"></div>
</div>

<script>
  let todos=[];

  function lerM3U(texto){
    const canais=[];let atual=null;
    for(const l of texto.split("\n").map(x=>x.trim())){
      if(l.startsWith("#EXTINF")){
        atual={nome:l.split(",").pop(),
               grupo:(l.match(/group-title="([^"]*)"/)||[])[1]||""};
      }else if(l&&!l.startsWith("#")&&atual){atual.url=l;canais.push(atual);atual=null}
    }
    return canais;
  }

  const tipo=(x,t)=>x.url.includes(t);

  document.getElementById("arquivo").onchange=async e=>{
    const f=e.target.files[0];
    const c=lerM3U(await f.text());
    todos=c;
    const filmes=c.filter(x=>tipo(x,"/movie/"));
    const series=c.filter(x=>tipo(x,"/series/"));
    const vivo=c.length-filmes.length-series.length;
    nVivo.textContent=vivo+" Canais";
    nFilmes.textContent=filmes.length+" Filmes";
    nSeries.textContent=series.length+" Séries";
    nPl.textContent="1 Playlist";
    nomeLista.textContent=rodape.textContent=f.name;
  };

  function abrir(lista){
    tela.style.display="block";
    const mostrar=t=>canais.innerHTML=lista
      .filter(x=>x.nome.toLowerCase().includes(t.toLowerCase()))
      .slice(0,300)
      .map(x=>`<div class="item" data-i="${lista.indexOf(x)}">${x.nome}</div>`).join("");
    mostrar("");
    busca.value="";
    busca.oninput=()=>mostrar(busca.value);
    canais.onclick=e=>{const x=lista[e.target.dataset.i]; if(x) tocar(x.url)};
  }

  function tocar(url){
    if(window.hls) hls.destroy();
    if(url.includes(".m3u8")&&Hls.isSupported()){
      window.hls=new Hls(); hls.loadSource(url); hls.attachMedia(player);
    } else player.src=url;
  }

  bVivo.onclick=()=>abrir(todos.filter(x=>!tipo(x,"/movie/")&&!tipo(x,"/series/")));
  bFilmes.onclick=()=>abrir(todos.filter(x=>tipo(x,"/movie/")));
  bSeries.onclick=()=>abrir(todos.filter(x=>tipo(x,"/series/")));

  setInterval(()=>hora.textContent=new Date().toLocaleString("pt-BR",
    {hour:"2-digit",minute:"2-digit",weekday:"short",day:"numeric",month:"short"}),1000);
</script>
</body>
</html>
